name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: jdx/mise-action@v3
        with:
          install_args: --locked actionlint hk mr-boxington shellcheck shfmt taplo usage
      - uses: ./.github/actions/mbx
      - name: Run non-compiling linters
        run: mise run lint
        env:
          HK_SKIP_STEPS: cargo-clippy
      - name: Delegate cgroup controllers for kernel enforcement tests
        run: |
          sudo mkdir /sys/fs/cgroup/pacvamp-ci
          echo '+cpu +memory +pids' | sudo tee /sys/fs/cgroup/pacvamp-ci/cgroup.subtree_control
          sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/pacvamp-ci
          # Migration requires write access at the common ancestor of the
          # runner's service cgroup and this test subtree (ephemeral runner).
          sudo chown "$(id -u):$(id -g)" /sys/fs/cgroup/cgroup.procs /sys/fs/cgroup/pacvamp-ci/cgroup.procs
      - parallel:
          - name: Test and check generated CLI docs
            run: |
              mbx test --workspace --all-features
              mise run render:check
            env:
              PACVAMP_REQUIRE_JAIL: "1"
              PACVAMP_TEST_CGROUP_ROOT: /sys/fs/cgroup/pacvamp-ci
          - name: Clippy
            run: mbx clippy --workspace --all-features --all-targets -- -D warnings
            env:
              CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-clippy

  arch-e2e:
    name: arch-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mise-action@v3
        with:
          install_args: --locked mr-boxington
      - uses: ./.github/actions/mbx
      - run: mbx build --locked --workspace --all-features
      - name: Allow nested build namespaces on the disposable runner
        # Ubuntu's host AppArmor restriction also applies inside privileged
        # Docker containers. The clean-image fixture runs bwrap as non-root.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test real Arch package transactions and jailed builds
        run: bash e2e/run_all_tests
        env:
          PACVAMP_E2E_CONTAINER: "1"

  # Single fan-in gate, so branch protection can require one stable check and
  # skipped jobs cannot silently satisfy the required status.
  final:
    permissions: {}
    needs:
      - ci
      - arch-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check job results
        if: |
          needs.ci.result != 'success' ||
          needs.arch-e2e.result != 'success'
        run: exit 1
      - run: echo "All CI jobs completed successfully"
