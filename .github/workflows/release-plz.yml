name: release-plz

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-plz

jobs:
  release-plz:
    if: github.repository == 'jdx/pacvamp'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The task pushes the release tag and force-updates the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          cache: false
      - run: mise trust --all
      - run: mise run release-plz
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
