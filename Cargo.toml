[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/jdx/pacvamp"
homepage = "https://github.com/jdx/pacvamp"
authors = ["Jeff Dickey <@jdx>"]

[workspace.dependencies]
alpm-db = { path = "crates/alpm-db" }
base64 = "0.22"
blake2 = "0.10"
ed25519-dalek = "2"
getrandom = "0.3"
pacvamp-cli-support = { path = "crates/cli-support" }
pacvamp = { path = "crates/pacvamp" }
pacvamp-policy = { path = "crates/pacvamp-policy" }
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
packslip = { path = "crates/packslip" }
ratatui = "0.30"

color-eyre = "0.6"
eyre = "0.6"
indexmap = { version = "2", features = ["serde"] }
nix = { version = "0.31", features = ["fs", "user"] }
schemars = "1"
insta = { version = "1", features = ["filters", "json"] }
jiff = "0.2"
landlock = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
seccompiler = "0.5"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
# usage-rs derives scan this table line by line for the alias below; see taplo.toml.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
usage_rs = { package = "usage-rs", version = "6", features = ["completions"] }
which = "8"

[profile.release]
lto = "thin"
codegen-units = 1
