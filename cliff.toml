[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]($REPO/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}

    {% for commit in commits %}\
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]($REPO/pull/{{ commit.remote.pr_number }}){% endif %}
    {% endfor %}\
{% endfor %}
"""
footer = "<!-- generated by git-cliff -->\n"
trim = true
postprocessors = [{ pattern = '\$REPO', replace = "https://github.com/jdx/pacvamp" }]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [{ pattern = '\(#([0-9]+)\)', replace = "" }]
commit_parsers = [
  { message = '^chore: release', skip = true },
  { body = '.*security', group = "Security" },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Bug fixes" },
  { message = '^perf', group = "Performance" },
  { message = '^doc', group = "Documentation" },
  { message = '^refactor', group = "Refactoring" },
  { message = '^test', group = "Testing" },
  { message = '^(chore|ci|build)', group = "Maintenance" },
  { message = '.', group = "Other changes" },
]
filter_commits = false
tag_pattern = '^v\d+\.\d+\.\d+$'
sort_commits = "oldest"

[remote.github]
owner = "jdx"
repo = "pacvamp"
