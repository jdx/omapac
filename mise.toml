wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }
[env]
_.path = ["./target/debug"]

[tools]
actionlint = "latest"
"bun" = "latest"
cargo-insta = "latest"
"cargo:cargo-edit" = "latest"
communique = "latest"
git-cliff = "latest"
hk = "latest"
mr-boxington = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
usage = "latest"

[tasks.build]
alias = "b"
description = "Build every crate"
run = "cargo build --workspace --all-features"

[tasks.test]
alias = "t"
description = "Run unit, integration, and mandatory Arch E2E tests"
depends = ["test:unit", "test:e2e"]

[tasks."test:unit"]
description = "Run the Rust unit and integration tests"
run = "cargo test --workspace --all-features"

[tasks."test:e2e"]
description = "Run E2E tests (requires Docker; missing prerequisites fail)"
depends = ["build"]
run = "bash e2e/run_all_tests"
[tasks."test:e2e".env]
PACVAMP_E2E_CONTAINER = "1"

[tasks.clippy]
description = "Run clippy with warnings denied"
run = "cargo clippy --workspace --all-features --all-targets -- -D warnings"

[tasks.lint]
description = "Run every check"
run = "hk run check --all"

[tasks.lint-fix]
description = "Run every check and fix what can be fixed"
run = "hk run fix --all"

[tasks.snapshots]
description = "Update insta snapshots"
run = "cargo insta test --accept --workspace --all-features"

[tasks.render]
description = "Regenerate everything derived from the code"
depends = ["render:usage"]

[tasks."docs:dev"]
description = "Start the documentation website"
depends = ["render"]
run = "bun install && bun run docs:dev"

[tasks."docs:build"]
description = "Build the documentation website"
depends = ["render"]
run = "bun install --frozen-lockfile && bun run docs:build"

[tasks."render:usage"]
description = "Render the CLI reference under docs/cli from the usage specs"
depends = ["build"]
shell = "bash -c"
run = """
set -euo pipefail
for bin in pacvamp pacvamp-repo; do
  rm -rf "docs/cli/$bin"
  mkdir -p "docs/cli/$bin"
  "target/debug/$bin" __usage > "docs/cli/$bin.usage.kdl"
  usage generate markdown -f "docs/cli/$bin.usage.kdl" -m --html-encode --out-dir "docs/cli/$bin" --url-prefix "/cli/$bin"
done
"""

[tasks."render:check"]
description = "Fail when docs/cli is out of date"
depends = ["render"]
run = """
git diff --exit-code -- docs/cli
test -z "$(git ls-files --others --exclude-standard -- docs/cli)"
"""

[tasks.ci]
description = "What CI runs"
depends = ["lint", "build", "test", "render:check", "docs:build"]

[tasks."bench:search"]
description = "Benchmark repository search startup on a reproducible Arch-sized corpus"
run = "cargo build --locked --release -p pacvamp && python3 benchmarks/search.py"
