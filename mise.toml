[env]
_.path = ["./target/debug"]

[tools]
cargo-insta = "latest"
communique = "latest"
hk = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
usage = "latest"

[tasks.build]
alias = "b"
description = "Build every crate"
run = "cargo build --workspace --all-features"

[tasks.test]
alias = "t"
description = "Run unit tests"
depends = ["test:unit"]

[tasks."test:unit"]
description = "Run unit tests"
run = "cargo test --workspace --all-features"

[tasks.clippy]
description = "Run clippy with warnings denied"
run = "cargo clippy --workspace --all-features --all-targets -- -D warnings"

[tasks.lint]
description = "Run every check"
run = "hk run check --all"

[tasks.lint-fix]
description = "Run every check and fix what can be fixed"
run = "hk run fix --all"

[tasks.snapshots]
description = "Update insta snapshots"
run = "cargo insta test --accept --workspace --all-features"

[tasks.render]
description = "Regenerate everything derived from the code"
depends = ["render:usage"]

[tasks."render:usage"]
description = "Render the CLI reference under docs/cli from the usage specs"
depends = ["build"]
shell = "bash -c"
run = """
set -euo pipefail
for bin in omapac omapac-repo packslip; do
  rm -rf "docs/cli/$bin"
  mkdir -p "docs/cli/$bin"
  "target/debug/$bin" __usage > "docs/cli/$bin.usage.kdl"
  usage generate markdown -f "docs/cli/$bin.usage.kdl" -m --out-dir "docs/cli/$bin" --url-prefix "/cli/$bin"
done
"""

[tasks."render:check"]
description = "Fail when docs/cli is out of date"
depends = ["render"]
run = "git diff --exit-code -- docs/cli"

[tasks.ci]
description = "What CI runs"
depends = ["lint", "build", "test", "render:check"]
